name: Security

on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    - cron: '31 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: Scan repository secrets
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  image-scan-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: docker/Dockerfile.api
            target: runtime
          - name: migration
            file: docker/Dockerfile.api
            target: migration
          - name: worker
            file: docker/Dockerfile.worker
            target: runtime
          - name: web
            file: docker/Dockerfile.web
            target: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build scan image
        id: image_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: vape-${{ matrix.name }}:security-scan
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Scan image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vape-${{ matrix.name }}:security-scan
          version: v0.73.0
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln,secret
          limit-severities-for-sarif: true
          exit-code: '1'
      - name: Verify Trivy SARIF output
        id: trivy_sarif
        if: ${{ always() }}
        shell: bash
        env:
          SARIF_FILE: trivy-${{ matrix.name }}.sarif
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          if [[ -f "$SARIF_FILE" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          if [[ "$TRIVY_OUTCOME" != "skipped" ]]; then
            echo "::error file=.github/workflows/security.yml::Trivy did not produce the expected SARIF file: $SARIF_FILE"
            exit 1
          fi
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && steps.trivy_sarif.outputs.exists == 'true' }}
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        if: ${{ always() && steps.image_build.outcome == 'success' }}
        with:
          image: vape-${{ matrix.name }}:security-scan
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          format: spdx-json
