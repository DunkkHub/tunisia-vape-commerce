packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

minimumReleaseAgeExclude:
  - bullmq@5.80.2

overrides:
  brace-expansion: 5.0.9
  # Swagger 11.4.6 pins 5.2.1; remove after a stable release includes the GHSA-pm4m patch.
  js-yaml: 5.2.2
  postcss: 8.5.26
  undici: 7.29.0
