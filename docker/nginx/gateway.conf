upstream vape_api {
    server api:3000;
    keepalive 32;
}

upstream vape_web {
    server web:8080;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost 127.0.0.1;
    server_tokens off;

    client_max_body_size 10m;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http://localhost:9000; connect-src 'self'" always;

    # Catalogue media downloads are bounded and locked server-side, but a reviewed batch can
    # legitimately take several minutes. Keep the longer timeout scoped to this exact admin route.
    location ~ ^/api/v1/admin/catalog/imports/[^/]+/media/apply$ {
        proxy_http_version 1.1;
        proxy_pass http://vape_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 7200s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_pass http://vape_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location / {
        proxy_http_version 1.1;
        proxy_pass http://vape_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    return 444;
}
